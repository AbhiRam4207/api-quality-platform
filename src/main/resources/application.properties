spring.application.name=api-quality-platform

# ---------------------------------------------------------------------------
# Database configuration
#
# No credentials are stored in this file. Values are read from environment
# variables (or command-line args) and fall back to safe local defaults.
#
# Local development options:
#   1. Export environment variables before starting the app:
#        SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   2. Or create a gitignored application-local.properties override and start
#      with the "local" profile:
#        ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#      or  set SPRING_PROFILES_ACTIVE=local
#
# The password is required when the target PostgreSQL enforces one. If the
# env var is unset the app attempts an empty password and fails fast, which is
# the intended signal to configure it.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api_quality}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ---------------------------------------------------------------------------
# Optional outbound credentials for GET /api/apis/execute
#
# Left unset, no Authorization header is sent with the executed request.
# Configure either via environment variables:
#   API_EXECUTION_USERNAME, API_EXECUTION_PASSWORD
# or via properties:
#   api.execution.username, api.execution.password
# ---------------------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
